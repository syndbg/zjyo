name: Main
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup default stable
          rustup update
          rustup component add rustfmt clippy
          rustup show
          cargo -Vv

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --verbose --all-features --workspace

  test-docker:
    name: Test in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t zjyo .

      - name: Run Docker tests
        run: docker run --rm zjyo /test.sh

  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [test, test-docker]
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup default stable
          rustup update
          rustup show
          cargo -Vv

      - name: Install cargo-release
        run: cargo install cargo-release

      - name: Determine version bump type
        id: bump
        run: |
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")

          if git log "$CURRENT_VERSION"..HEAD --pretty=format:"%s" | grep -q "BREAKING CHANGE\|!:"; then
            echo "level=major" >> "$GITHUB_OUTPUT"
          elif git log "$CURRENT_VERSION"..HEAD --pretty=format:"%s" | grep -qE "^feat(\(.+\))?:"; then
            echo "level=minor" >> "$GITHUB_OUTPUT"
          else
            echo "level=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Cargo.toml, commit, and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo release ${{ steps.bump.outputs.level }} --no-publish --no-confirm --execute
