name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup default stable
          rustup update
          rustup show
          cargo -Vv

      - name: Install cargo-release
        run: cargo install cargo-release

      - name: Bump Cargo.toml, commit, and tag
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo release ${{ inputs.bump }} --no-publish --no-confirm --execute
          echo "version=v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [tag-release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-release.outputs.version }}

      - name: Install Rust
        run: |
          rustup default stable
          rustup update
          rustup show
          cargo -Vv

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build Linux binaries
        run: |
          rustup target add x86_64-unknown-linux-gnu
          rustup target add x86_64-unknown-linux-musl

          sudo apt update
          sudo apt install -y musl-tools

          cargo build --release --target x86_64-unknown-linux-gnu
          cargo build --release --target x86_64-unknown-linux-musl

          mkdir -p release/{linux-x64,linux-x64-musl}

          cp target/x86_64-unknown-linux-gnu/release/zjyo release/linux-x64/
          cp target/x86_64-unknown-linux-musl/release/zjyo release/linux-x64-musl/

          cp README.md LICENSE release/linux-x64/
          cp README.md LICENSE release/linux-x64-musl/

      - name: Create Linux archives
        run: |
          cd release
          tar -czf zjyo-${{ needs.tag-release.outputs.version }}-linux-x64.tar.gz -C linux-x64 .
          tar -czf zjyo-${{ needs.tag-release.outputs.version }}-linux-x64-musl.tar.gz -C linux-x64-musl .

      - name: Install nfpm
        run: |
          curl -sSL https://github.com/goreleaser/nfpm/releases/latest/download/nfpm_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build .deb and .rpm packages
        env:
          VERSION: ${{ needs.tag-release.outputs.version }}
        run: |
          export VERSION="${VERSION#v}"
          ARCH=amd64 nfpm package --config nfpm.yaml --packager deb \
            --target "release/zjyo_${VERSION}_amd64.deb"
          ARCH=x86_64 nfpm package --config nfpm.yaml --packager rpm \
            --target "release/zjyo-${VERSION}-1.x86_64.rpm"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux
          path: |
            release/zjyo-${{ needs.tag-release.outputs.version }}-linux-x64.tar.gz
            release/zjyo-${{ needs.tag-release.outputs.version }}-linux-x64-musl.tar.gz
            release/zjyo_*.deb
            release/zjyo-*.rpm

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [tag-release]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-release.outputs.version }}

      - name: Install Rust
        run: |
          rustup default stable
          rustup update
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          rustup show
          cargo -Vv

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build macOS binaries
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

          mkdir -p release/{macos-x64,macos-arm64}

          cp target/x86_64-apple-darwin/release/zjyo release/macos-x64/
          cp README.md LICENSE release/macos-x64/

          cp target/aarch64-apple-darwin/release/zjyo release/macos-arm64/
          cp README.md LICENSE release/macos-arm64/

      - name: Create macOS archives
        run: |
          cd release
          tar -czf zjyo-${{ needs.tag-release.outputs.version }}-macos-x64.tar.gz -C macos-x64 .
          tar -czf zjyo-${{ needs.tag-release.outputs.version }}-macos-arm64.tar.gz -C macos-arm64 .

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-macos
          path: |
            release/zjyo-${{ needs.tag-release.outputs.version }}-macos-x64.tar.gz
            release/zjyo-${{ needs.tag-release.outputs.version }}-macos-arm64.tar.gz

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [tag-release, build-linux, build-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/release-artifacts-linux/* release/
          cp artifacts/release-artifacts-macos/* release/
          ls -la release/

      - name: Compute package filenames
        id: pkg
        run: |
          DEB_FILE=$(basename release/zjyo_*.deb)
          RPM_FILE=$(basename release/zjyo-*.rpm)
          echo "deb=$DEB_FILE" >> "$GITHUB_OUTPUT"
          echo "rpm=$RPM_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag-release.outputs.version }}
          name: Release ${{ needs.tag-release.outputs.version }}
          body: |
            ## Changes

            This release was cut manually via the Release workflow.

            ### Installation

            **Quick Install Script:**
            ```bash
            curl -sSL https://github.com/syndbg/zjyo/raw/main/install.sh | bash
            ```

            **Manual Installation:**

            **Linux (x86_64 - glibc):**
            ```bash
            wget https://github.com/syndbg/zjyo/releases/download/${{ needs.tag-release.outputs.version }}/zjyo-${{ needs.tag-release.outputs.version }}-linux-x64.tar.gz
            tar -xzf zjyo-${{ needs.tag-release.outputs.version }}-linux-x64.tar.gz
            sudo cp zjyo /usr/local/bin/
            ```

            **Linux (x86_64 - musl, static binary):**
            ```bash
            wget https://github.com/syndbg/zjyo/releases/download/${{ needs.tag-release.outputs.version }}/zjyo-${{ needs.tag-release.outputs.version }}-linux-x64-musl.tar.gz
            tar -xzf zjyo-${{ needs.tag-release.outputs.version }}-linux-x64-musl.tar.gz
            sudo cp zjyo /usr/local/bin/
            ```

            **Linux (.deb - Debian/Ubuntu):**
            ```bash
            wget https://github.com/syndbg/zjyo/releases/download/${{ needs.tag-release.outputs.version }}/${{ steps.pkg.outputs.deb }}
            sudo dpkg -i ${{ steps.pkg.outputs.deb }}
            ```

            **Linux (.rpm - Red Hat/CentOS/Fedora):**
            ```bash
            wget https://github.com/syndbg/zjyo/releases/download/${{ needs.tag-release.outputs.version }}/${{ steps.pkg.outputs.rpm }}
            sudo rpm -i ${{ steps.pkg.outputs.rpm }}
            ```

            **macOS (Intel x86_64 only):**
            ```bash
            wget https://github.com/syndbg/zjyo/releases/download/${{ needs.tag-release.outputs.version }}/zjyo-${{ needs.tag-release.outputs.version }}-macos-x64.tar.gz
            tar -xzf zjyo-${{ needs.tag-release.outputs.version }}-macos-x64.tar.gz
            sudo cp zjyo /usr/local/bin/
            ```

            **macOS (Apple Silicon ARM64 only):**
            ```bash
            wget https://github.com/syndbg/zjyo/releases/download/${{ needs.tag-release.outputs.version }}/zjyo-${{ needs.tag-release.outputs.version }}-macos-arm64.tar.gz
            tar -xzf zjyo-${{ needs.tag-release.outputs.version }}-macos-arm64.tar.gz
            sudo cp zjyo /usr/local/bin/
            ```

            See [README.md](https://github.com/syndbg/zjyo#readme) for shell integration setup.
          files: |
            release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
